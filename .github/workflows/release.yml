name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    # id-token and attestations sign the provenance of the archive (Sigstore via GitHub OIDC).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: sh tools/leakcheck.sh
        env:
          LEAKCHECK_PATTERN: ${{ secrets.LEAKCHECK_PATTERN }}
      - run: python3 -m unittest discover -s tests
      - name: version in plugin.json and marketplace.json matches the tag
        run: |
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          m=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          test "v$v" = "$GITHUB_REF_NAME"
          test "$v" = "$m"
      - run: python3 tools/package.py
      # Users verify with: gh attestation verify <archive> --repo drxinfra/agent-guard
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
