name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Leak patterns live in a repository secret; forks have no secret and the check is skipped.
      - run: sh tools/leakcheck.sh
        env:
          LEAKCHECK_PATTERN: ${{ secrets.LEAKCHECK_PATTERN }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/package.py
      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict

  # Hooks must work on the old python3 of long-lived servers.
  old-python:
    runs-on: ubuntu-latest
    container: python:3.7-slim
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
